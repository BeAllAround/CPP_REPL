[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
# platforms = ["Linux", "Mac OSX", "Windows"]
# license-files = ["LICENSE"]
include-package-data = false


# See: https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
# Also see: src-layout vs flat-layout: https://setuptools.pypa.io/en/latest/userguide/package_discovery.html
[tool.setuptools.packages.find]
# where = ["src"] # list of folders that contain the packages (["."] by default)
include = ["cpp_repl*"] # includes cpp_repl.core, etc.
exclude = ["docs", "tests"]
# namespaces = false  # to disable scanning PEP 420 namespaces (true by default)


# [tool.uv]
# package = true

[project]
name = "BeAllAround.CPP_REPL"
version = "0.0.1"
description = "Interactive Shell for the C++ Programming Language built on top of LLVM's ClangRepl Project."
readme = "README.md"
requires-python = ">=3.10"

license = "MIT"
license-files = [
	"LICENSE",
]

authors = [
{ name = "Aleksandar Milenkovic", email = "milenkovicaleksandar470@gmail.com" },
]
maintainers = [
{ name = "Aleksandar Milenkovic", email = "milenkovicaleksandar470@gmail.com" },
]
keywords = ["python", "packaging", "repl"]
classifiers = [
	"Programming Language :: Python :: 3",
# "License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]
dependencies = [
	"setuptools==61.0.0",
	"prompt-toolkit==3.0.52",
	"pygments==2.19.2",
]

[project.optional-dependencies]
dev = [
]
docs = [
]

# TODO: https://docs.astral.sh/uv/guides/package/#publishing-your-package

[project.scripts]
cpp_repl = "cpp_repl:main"



# https://docs.astral.sh/uv/concepts/projects/config/#limited-resolution-environments
[tool.uv]
environments = [
    "sys_platform == 'linux'",
]
# required-environments = [
#     "sys_platform == 'linux'",
# ]


